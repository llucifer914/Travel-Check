<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="旅遊記帳">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F2D4A">
<title>旅遊記帳本</title>
<style>
:root{--navy:#0F2D4A;--blue:#1A6BCC;--bg:#F5F7FA;--card:#fff;--border:#E8EEF6;--text:#1A2D45;--muted:#8CA0B8;--dim:#9DAFC5;--sub:#F4F7FC;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;background:var(--bg);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow:hidden;color:var(--text)}
#app{width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.scr{flex:1;overflow:hidden;display:flex;flex-direction:column}
.scrl{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.bnav{display:flex;background:var(--card);border-top:1px solid var(--border);padding:8px 4px calc(8px + var(--sb));flex-shrink:0}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;background:none;border:none;cursor:pointer;color:var(--dim);font-size:11px;font-weight:500;font-family:inherit}
.nbtn.on{color:var(--blue);font-weight:700}
.ni{width:20px;height:3px;border-radius:99px;background:var(--blue);margin-bottom:1px}
.fab{position:fixed;right:20px;bottom:calc(76px + var(--sb));width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--blue));color:white;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 24px rgba(26,107,204,.5);z-index:10}
.hero{background:linear-gradient(150deg,#0F2D4A 0%,#1A5099 55%,#1A6BCC 100%);padding:calc(var(--st) + 20px) 20px 32px;color:white;flex-shrink:0}
.card{background:var(--card);border-radius:20px;box-shadow:0 2px 8px rgba(15,45,74,.06)}
.er{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #F4F7FC;cursor:pointer}
.er:last-child{border-bottom:none}
.er:active{background:var(--sub)}
.modal{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:50;animation:su .25s cubic-bezier(.34,1.36,.64,1)}
.mhdr{background:var(--card);border-bottom:1px solid var(--border);padding:calc(var(--st) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ibtn{width:36px;height:36px;border-radius:50%;background:var(--sub);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center}
.np{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nb{padding:14px 0;border-radius:14px;border:none;cursor:pointer;font-size:22px;font-weight:700;font-family:inherit;display:flex;align-items:center;justify-content:center}
.nb:active{opacity:.7}
.nb.r{background:var(--card);color:var(--navy);box-shadow:0 1px 4px rgba(15,45,74,.08)}
.nb.d{background:#E2EAF4;color:#4A6080}
.abtn{width:32px;height:32px;border-radius:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
*{-ms-overflow-style:none;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
input{font-family:inherit}
input::placeholder{color:#B0C0D4}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes su{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ═══ CATEGORIES (16) ═══
const CATS=[
  {id:'food',       l:'餐飲',   e:'🍜', c:'#F97316', b:'#FFF3E8'},
  {id:'cafe',       l:'咖啡飲料',e:'☕', c:'#92400E', b:'#FEF3E2'},
  {id:'dessert',    l:'甜點零食',e:'🍰', c:'#EC4899', b:'#FDF0F6'},
  {id:'bar',        l:'酒吧',   e:'🍺', c:'#B45309', b:'#FFFBEB'},
  {id:'transport',  l:'大眾交通',e:'🚌', c:'#1A6BCC', b:'#E8F1FB'},
  {id:'taxi',       l:'計程車', e:'🚕', c:'#0891B2', b:'#ECFEFF'},
  {id:'flight',     l:'機票',   e:'✈️', c:'#7C3AED', b:'#F5F3FF'},
  {id:'accommodation',l:'住宿', e:'🏨', c:'#8B5CF6', b:'#F2EEFE'},
  {id:'ticket',     l:'景點門票',e:'🎫', c:'#059669', b:'#ECFDF5'},
  {id:'activity',   l:'活動體驗',e:'🎯', c:'#10B981', b:'#E8FAF4'},
  {id:'shopping',   l:'購物',   e:'🛍️', c:'#E11D48', b:'#FFF1F2'},
  {id:'market',     l:'超市便利',e:'🛒', c:'#16A34A', b:'#F0FDF4'},
  {id:'souvenir',   l:'伴手禮', e:'🎁', c:'#DC2626', b:'#FEF2F2'},
  {id:'beauty',     l:'美容SPA',e:'💆', c:'#DB2777', b:'#FDF2F8'},
  {id:'health',     l:'醫療藥品',e:'💊', c:'#EF4444', b:'#FEF0F0'},
  {id:'other',      l:'其他',   e:'📦', c:'#6B7280', b:'#F3F4F6'},
];
const CURRS=[
  {code:'JPY',name:'日圓',rate:.208,sym:'¥'},
  {code:'USD',name:'美元',rate:32.5,sym:'$'},
  {code:'EUR',name:'歐元',rate:35.2,sym:'€'},
  {code:'KRW',name:'韓圜',rate:.024,sym:'₩'},
  {code:'THB',name:'泰銖',rate:.95,sym:'฿'},
  {code:'SGD',name:'新幣',rate:24.1,sym:'S$'},
  {code:'HKD',name:'港幣',rate:4.15,sym:'HK$'},
  {code:'TWD',name:'台幣',rate:1,sym:'NT$'},
];
const PTAGS=['#公費','#過路費','#景點門票','#伴手禮','#停車費','#緊急'];

// ═══ STATE ═══
const td=()=>new Date().toISOString().slice(0,10);
let S={tab:'home',tripId:null,trips:[],expenses:[],search:'',showNewTrip:false,newTripForm:{name:'',start:td(),end:td()},editTripId:null,editTripForm:{name:'',start:'',end:''}};
let M={open:false,editId:null,cat:'food',amt:'',cur:'JPY',name:'',date:td(),loc:'',tags:[],cpOpen:false,scanning:false,scanned:false};

// ═══ HELPERS ═══
const gc=id=>CATS.find(c=>c.id===id)||CATS[CATS.length-1];
const gr=code=>CURRS.find(c=>c.code===code)||CURRS[0];
const curTrip=()=>S.trips.find(t=>t.id===S.tripId)||(S.trips.length?S.trips[0]:null);
const curExps=()=>S.tripId?S.expenses.filter(e=>e.tripId===S.tripId):[];
function groupByDate(arr){
  const m={};arr.forEach(e=>(m[e.date]=m[e.date]||[]).push(e));
  return Object.entries(m).sort(([a],[b])=>b.localeCompare(a))
    .map(([date,items])=>({date,items:[...items].sort((a,b)=>b.time.localeCompare(a.time)),total:items.reduce((s,e)=>s+e.twd,0)}));
}
function dlabel(s){
  const t=td(),y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(s===t)return'今天';if(s===y)return'昨天';
  const d=new Date(s+'T00:00:00');return`${d.getMonth()+1}月${d.getDate()}日`;
}
function save(){try{localStorage.setItem('trav3',JSON.stringify({expenses:S.expenses,trips:S.trips,tripId:S.tripId}))}catch(e){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('trav3')||localStorage.getItem('trav2')||'{}');
    if(d.expenses)S.expenses=d.expenses.map(e=>({...e,tripId:e.tripId||null}));
    if(d.trips&&d.trips.length)S.trips=d.trips;
    if(d.tripId)S.tripId=d.tripId;
  }catch(e){}
}

// ═══ CHARTS ═══
function donut(data,total){
  if(!total||!data.length)return'';
  const R=50,W=20,CX=70,CY=70,C=2*Math.PI*R;let acc=0;
  const segs=data.filter(d=>d.value>0).map(d=>{
    const len=(d.value/total)*C,off=-acc;acc+=len;
    return`<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${d.color}" stroke-width="${W}" stroke-dasharray="${(len-1).toFixed(2)} ${(C+2).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${CX} ${CY})"/>`;
  }).join('');
  return`<svg width="140" height="140" viewBox="0 0 140 140"><circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#EEF3F9" stroke-width="${W}"/>${segs}</svg>`;
}
function bars(data){
  if(!data.length)return'';
  const mx=Math.max(...data.map(d=>d.value),1),W=310,H=140,pL=4,pB=24,pT=8,cH=H-pB-pT;
  const sw=(W-pL*2)/data.length,bw=Math.min(sw*.65,36);
  const rects=data.map((d,i)=>{
    const bh=Math.max((d.value/mx)*cH,2),x=pL+i*sw+(sw-bw)/2,y=pT+cH-bh;
    return`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="5" fill="url(#bg)"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle" fill="#9DAFC5" font-size="10" font-family="-apple-system,sans-serif">${d.label}</text>`;
  }).join('');
  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1A6BCC"/><stop offset="100%" stop-color="#4ECDC4"/></linearGradient></defs>${rects}</svg>`;
}

// ═══ ICONS ═══
const I={
  home:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>`,
  list:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`,
  chart:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>`,
  cog:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
  plus:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  x:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  cam:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
  chk:`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  chv:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>`,
  pln:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21 4 19 2c-2-2-4-2-5.5-.5L10 5 1.8 6.2c-.5.1-.9.5-.9 1 0 .3.1.5.3.7L5 11l1 3L4 16l2 2 2-2 3 1 3.8 3.8c.2.2.5.3.7.3.5 0 .9-.4 1-.9z"/></svg>`,
  tsh:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
  edt:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
  rcp:`<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1-2-1Z"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/></svg>`,
  pin:`<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,
  srch:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
};

// ═══ EMPTY STATE ═══
function emptyTripsHTML(){
  return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center">
    <div style="font-size:60px;margin-bottom:18px">✈️</div>
    <p style="font-size:19px;font-weight:800;color:#0F2D4A;margin:0 0 8px">歡迎使用旅遊記帳本</p>
    <p style="font-size:13px;color:#8CA0B8;margin:0 0 28px;line-height:1.7">先建立你的第一個旅遊，<br>即可開始記帳。</p>
    <button id="gts" style="padding:13px 28px;border-radius:16px;border:none;cursor:pointer;font-size:15px;font-weight:700;font-family:inherit;background:linear-gradient(135deg,#0F2D4A,#1A6BCC);color:white;box-shadow:0 4px 16px rgba(26,107,204,.35)">✈ 新增旅遊</button>
  </div>`;
}

// ═══ EXPENSE ROW ═══
function erHTML(e,del=true){
  const c=gc(e.cat),cr=gr(e.cur);
  return`<div class="er" data-id="${e.id}" data-del="${del}">
    <div style="width:40px;height:40px;border-radius:12px;background:${c.b};display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${c.e}</div>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px">
        <span style="font-size:13px;font-weight:600;color:#1A2D45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.name}</span>
        ${e.rcpt?`<span style="color:#10B981;flex-shrink:0">${I.rcp}</span>`:''}
      </div>
      <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">
        <span style="font-size:11px;color:#9DAFC5">${e.date} ${e.time}</span>
        ${e.loc?`<span style="color:#C8D8E8">${I.pin}</span><span style="font-size:11px;color:#9DAFC5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px">${e.loc}</span>`:''}
        ${e.tags&&e.tags[0]?`<span style="font-size:11px;color:#1A6BCC;font-weight:700">${e.tags[0]}</span>`:''}
      </div>
    </div>
    <div class="eamt" data-id="${e.id}" style="text-align:right;flex-shrink:0">
      <p style="margin:0;font-size:13px;font-weight:700;color:#0F2D4A">NT$${e.twd.toLocaleString()}</p>
      <p style="margin:0;font-size:11px;color:#9DAFC5">${cr.sym}${e.amount.toLocaleString()}</p>
    </div>
  </div>`;
}

// ═══ HOME ═══
function homeHTML(){
  if(!curTrip())return emptyTripsHTML();
  const ex=curExps(),total=ex.reduce((s,e)=>s+e.twd,0);
  const trip=curTrip(),t=td();
  const today=ex.filter(e=>e.date===t).reduce((s,e)=>s+e.twd,0);
  const ts=new Date(trip.start+'T00:00:00'),te=new Date(trip.end+'T00:00:00');
  const days=Math.max(1,Math.round((te-ts)/86400000)+1);
  const avg=ex.length?Math.round(total/days):0;
  const recent=[...ex].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,5);
  const stats=CATS.map(c=>({...c,total:ex.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.twd,0)})).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  return`<div class="scrl" style="padding-bottom:calc(90px + var(--sb))">
    <div class="hero">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:8px"><span style="color:#4ECDC4">${I.pln}</span><span style="color:#A8C8E8;font-size:13px;font-weight:600">${trip.name}</span></div>
        <div style="background:rgba(255,255,255,.13);border-radius:99px;padding:4px 12px;font-size:11px;color:#B8D4EC">${trip.start} ～ ${trip.end}</div>
      </div>
      <p style="color:#7AB4D8;font-size:12px;margin-bottom:4px">旅程總花費</p>
      <p style="font-size:44px;font-weight:800;color:white;letter-spacing:-1.5px;line-height:1">NT$${total.toLocaleString()}</p>
      <div style="display:flex;gap:10px;margin-top:16px">
        ${[{l:'今日花費',v:`NT$${today.toLocaleString()}`},{l:'消費筆數',v:`${ex.length} 筆`},{l:'日均花費',v:`NT$${avg.toLocaleString()}`}]
          .map(s=>`<div style="flex:1;background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px"><p style="margin:0 0 3px;font-size:10px;color:#7AAED0">${s.l}</p><p style="margin:0;font-weight:700;color:white;font-size:13px">${s.v}</p></div>`).join('')}
      </div>
    </div>
    ${stats.length?`<div style="padding:20px 16px 16px">
      <p style="font-size:11px;font-weight:700;color:#8CA0B8;margin:0 0 10px">消費分類</p>
      <div class="card" style="padding:16px">
        ${stats.slice(0,5).map((c,i,a)=>{const p=total>0?(c.total/total)*100:0;return`<div style="display:flex;align-items:center;gap:12px;padding-bottom:${i<a.length-1?12:0}px;margin-bottom:${i<a.length-1?12:0}px;border-bottom:${i<a.length-1?'1px solid #F4F7FC':'none'}">
          <span style="font-size:20px">${c.e}</span>
          <div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span style="font-size:13px;font-weight:600;color:#1A2D45">${c.l}</span><span style="font-size:13px;font-weight:700;color:#0F2D4A">NT$${c.total.toLocaleString()}</span></div>

// ═══ ANALYTICS ═══
function analyticsHTML(){
  if(!curTrip())return emptyTripsHTML();
  const ex=curExps(),total=ex.reduce((s,e)=>s+e.twd,0);
  const pie=CATS.map(c=>({name:c.l,emoji:c.e,color:c.c,value:ex.filter(e=>e.cat===c.id).reduce((s,e)=>s+e.twd,0)})).filter(d=>d.value>0).sort((a,b)=>b.value-a.value);
  const bar=groupByDate(ex).map(({date,total})=>({label:dlabel(date),value:total})).reverse().slice(-6);
  const top3=[...ex].sort((a,b)=>b.twd-a.twd).slice(0,3);
  return`<div style="background:white;border-bottom:1px solid #E8EEF6;padding:calc(var(--st) + 16px) 16px 12px;flex-shrink:0">
    <h1 style="margin:0 0 2px;font-size:22px;font-weight:800;color:#0F2D4A">消費分析</h1>
    <p style="margin:0;font-size:13px;color:#8CA0B8">旅程總花費 NT$${total.toLocaleString()}</p>
  </div>
  <div class="scrl" style="padding:16px;padding-bottom:calc(90px + var(--sb))">
    ${!ex.length?`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;color:#B0C0D4"><p style="font-size:48px;margin:0 0 12px">📊</p><p style="font-size:14px">尚無消費資料</p></div>`:`
    <div class="card" style="padding:16px;margin-bottom:14px">

      <div style="display:flex;align-items:center;gap:12px">
        <div>${donut(pie,total)}</div>
        <div style="flex:1;display:flex;flex-direction:column;gap:7px">

        </div>
      </div>
    </div>
    <div class="card" style="padding:16px;margin-bottom:14px">
      <p style="margin:0 0 12px;font-size:13px;font-weight:700;color:#1A2D45">📅 每日花費（台幣）</p>
      <div style="overflow-x:auto">${bars(bar)}</div>
    </div>
    ${top3.length?`<div class="card" style="padding:16px">
      <p style="margin:0 0 12px;font-size:13px;font-weight:700;color:#1A2D45">🏆 最高消費 Top 3</p>
      ${top3.map((e,i)=>{const c=gc(e.cat);return`<div style="display:flex;align-items:center;gap:12px;padding-bottom:${i<2?12:0}px;margin-bottom:${i<2?12:0}px;border-bottom:${i<2?'1px solid #F4F7FC':'none'}">

      </div>
      <div style="padding:0 16px 16px;display:flex;flex-wrap:wrap;gap:6px">
        ${PTAGS.map(t=>`<button class="tb" data-tag="${t}" style="font-size:12px;padding:5px 12px;border-radius:99px;border:none;cursor:pointer;font-weight:700;font-family:inherit;background:${M.tags.includes(t)?'#1A6BCC':'white'};color:${M.tags.includes(t)?'white':'#7A8FA8'};box-shadow:${M.tags.includes(t)?'none':'0 0 0 1.5px #DDE8F4'}">${t}</button>`).join('')}
      </div>
    </div>
    <div style="flex-shrink:0;padding:0 16px calc(var(--sb) + 14px);background:var(--bg)">
      <div class="np" style="margin-bottom:10px">
        ${['1','2','3','4','5','6','7','8','9','.','0','⌫'].map(n=>`<button class="nb ${n==='⌫'?'d':'r'}" data-n="${n}">${n}</button>`).join('')}
      </div>
      <button id="sv" style="width:100%;padding:16px;border-radius:18px;border:none;cursor:pointer;color:white;font-size:16px;font-weight:800;font-family:inherit;background:linear-gradient(135deg,#0F2D4A 0%,#1A6BCC 100%);opacity:${!M.amt||parseFloat(M.amt)<=0?.4:1}">
        ${isEdit?'更新記錄':'記帳完成'}
      </button>
    </div>
  </div>`;
}

// ═══ RENDER ═══
function render(){
  const pf=document.activeElement?.id,ps=document.querySelector('.scrl')?.scrollTop||0;
  const NAV=[{id:'home',ic:I.home,l:'首頁'},{id:'list',ic:I.list,l:'記錄'},{id:'analytics',ic:I.chart,l:'分析'},{id:'settings',ic:I.cog,l:'設定'}];
  const fn={home:homeHTML,list:listHTML,analytics:analyticsHTML,settings:settingsHTML};
  document.getElementById('app').innerHTML=`
    <div class="scr">${fn[S.tab]()}</div>
    <nav class="bnav">${NAV.map(n=>`<button class="nbtn${S.tab===n.id?' on':''}" data-t="${n.id}">${S.tab===n.id?'<div class="ni"></div>':''}${n.ic}<span>${n.l}</span></button>`).join('')}</nav>
    ${curTrip()?`<button class="fab" id="fab">${I.plus}</button>`:''}
    ${modalHTML()}`;
  const sc=document.querySelector('.scrl');if(sc&&!M.open)sc.scrollTop=ps;
  bind();
  if(pf){const el=document.getElementById(pf);if(el){el.focus();try{if(el.value!==undefined)el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}
}

// ═══ BIND ═══
function bind(){
  document.querySelectorAll('.nbtn[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
  const fab=document.getElementById('fab');if(fab)fab.onclick=()=>openM('food');
  const gts=document.getElementById('gts');if(gts)gts.onclick=()=>{S.tab='settings';S.showNewTrip=true;S.newTripForm={name:'',start:td(),end:td()};render()};

  // Expense rows: tap → show edit + delete
  document.querySelectorAll('.er[data-del="true"]').forEach(row=>{
    const id=parseInt(row.dataset.id);
    row.onclick=()=>{
      const amt=row.querySelector('.eamt'),ex=row.querySelector('.eacts');
      if(ex){ex.remove();if(amt)amt.style.display='block';return;}
      if(amt)amt.style.display='none';
      const acts=document.createElement('div');acts.className='eacts';acts.style.cssText='display:flex;gap:6px;flex-shrink:0';
      const eb=document.createElement('button');eb.innerHTML=I.edt;eb.style.cssText='padding:8px 12px;background:#EEF4FF;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;color:#1A6BCC';
      eb.onclick=ev=>{ev.stopPropagation();const e=S.expenses.find(x=>x.id===id);if(e)openM(e.cat,e);};
      const db=document.createElement('button');db.innerHTML=I.tsh;db.style.cssText='padding:8px 12px;background:#FEF0F0;border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;color:#EF4444';
      db.onclick=ev=>{ev.stopPropagation();S.expenses=S.expenses.filter(x=>x.id!==id);save();render();};
      acts.appendChild(eb);acts.appendChild(db);row.appendChild(acts);
    };
  });

  // Search
  const si=document.getElementById('si');if(si){si.oninput=e=>{S.search=e.target.value;render()};si.focus();}
  const cls=document.getElementById('cls');if(cls)cls.onclick=()=>{S.search='';render()};

  // Trips - switch
  document.querySelectorAll('.tsw[data-switch]').forEach(el=>el.onclick=()=>{S.tripId=el.dataset.switch;S.editTripId=null;save();render()});
  // Trips - edit
  document.querySelectorAll('.etbtn[data-tid]').forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();const tid=btn.dataset.tid,t=S.trips.find(x=>x.id===tid);
    if(!t)return;S.editTripId=tid;S.editTripForm={name:t.name,start:t.start,end:t.end};S.showNewTrip=false;render();
  });
  // Trips - delete
  document.querySelectorAll('.dtbtn[data-tid]').forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();const tid=btn.dataset.tid;
    S.trips=S.trips.filter(t=>t.id!==tid);S.expenses=S.expenses.filter(e=>e.tripId!==tid);
    if(S.tripId===tid)S.tripId=S.trips.length?S.trips[0].id:null;
    if(S.editTripId===tid)S.editTripId=null;save();render();
  });
  // Edit trip form
  const etn=document.getElementById('etn');if(etn){etn.oninput=e=>S.editTripForm.name=e.target.value;setTimeout(()=>etn.focus(),40);}
  const etsd=document.getElementById('etsd');if(etsd)etsd.onchange=e=>S.editTripForm.start=e.target.value;
  const eted=document.getElementById('eted');if(eted)eted.onchange=e=>S.editTripForm.end=e.target.value;
  const etcc=document.getElementById('etcc');if(etcc)etcc.onclick=()=>{S.editTripId=null;render()};
  const etcr=document.getElementById('etcr');if(etcr)etcr.onclick=()=>{
    if(!S.editTripForm.name.trim())return;
    const idx=S.trips.findIndex(t=>t.id===S.editTripId);
    if(idx!==-1)S.trips[idx]={...S.trips[idx],...S.editTripForm};
    S.editTripId=null;save();render();
  };
  // New trip form
  const ant=document.getElementById('ant');if(ant)ant.onclick=()=>{S.showNewTrip=true;S.newTripForm={name:'',start:td(),end:td()};S.editTripId=null;render()};
  const ntn=document.getElementById('ntn');if(ntn){ntn.oninput=e=>S.newTripForm.name=e.target.value;setTimeout(()=>ntn.focus(),40);}
  const ntsd=document.getElementById('ntsd');if(ntsd)ntsd.onchange=e=>S.newTripForm.start=e.target.value;
  const nted=document.getElementById('nted');if(nted)nted.onchange=e=>S.newTripForm.end=e.target.value;
  const ntcc=document.getElementById('ntcc');if(ntcc)ntcc.onclick=()=>{S.showNewTrip=false;render()};
  const ntcr=document.getElementById('ntcr');if(ntcr)ntcr.onclick=()=>{
    if(!S.newTripForm.name.trim())return;
    const id='t'+Date.now();
    S.trips.push({id,name:S.newTripForm.name,start:S.newTripForm.start,end:S.newTripForm.end});
    S.tripId=id;S.showNewTrip=false;save();render();
  };
  bindM();
}

function bindM(){
  if(!M.open)return;
  const mc=document.getElementById('mc');if(mc)mc.onclick=closeM;
  const ocr=document.getElementById('ocr');
  if(ocr)ocr.onclick=()=>{
    if(M.scanning||M.scanned)return;M.scanning=true;render();
    setTimeout(()=>{M.scanning=false;M.scanned=true;M.amt='850';M.name='スタバ 四条烏丸';M.cat='cafe';M.loc='四条, 京都';render()},1800);
  };
  const ct=document.getElementById('ct');if(ct)ct.onclick=e=>{e.stopPropagation();M.cpOpen=!M.cpOpen;render()};
  const cpbg=document.getElementById('cpbg');if(cpbg)cpbg.onclick=()=>{M.cpOpen=false;render()};
  document.querySelectorAll('.ci[data-code]').forEach(b=>b.onclick=e=>{e.stopPropagation();M.cur=b.dataset.code;M.cpOpen=false;render()});
  document.querySelectorAll('.cb[data-cat]').forEach(b=>b.onclick=()=>{M.cat=b.dataset.cat;render()});
  document.querySelectorAll('.tb[data-tag]').forEach(b=>b.onclick=()=>{const t=b.dataset.tag;M.tags=M.tags.includes(t)?M.tags.filter(x=>x!==t):[...M.tags,t];render()});
  document.querySelectorAll('.nb[data-n]').forEach(b=>b.onclick=()=>{
    const n=b.dataset.n;
    if(n==='.'&&M.amt.includes('.'))return;
    if(n==='⌫'){M.amt=M.amt.slice(0,-1);render();return;}
    if(M.amt.length>=9)return;
    M.amt=(M.amt==='0'&&n!=='.')?n:M.amt+n;render();
  });
  const mi=document.getElementById('mi');if(mi)mi.oninput=e=>M.name=e.target.value;
  const di=document.getElementById('di');if(di)di.onchange=e=>M.date=e.target.value;
  const li=document.getElementById('li');if(li)li.oninput=e=>M.loc=e.target.value;
  const sv=document.getElementById('sv');
  if(sv)sv.onclick=()=>{
    if(!M.amt||parseFloat(M.amt)<=0)return;
    const cr=gr(M.cur),cat=gc(M.cat),twd=Math.round(parseFloat(M.amt)*cr.rate);
    if(M.editId!==null){
      const idx=S.expenses.findIndex(e=>e.id===M.editId);
      if(idx!==-1)S.expenses[idx]={...S.expenses[idx],amount:parseFloat(M.amt),cur:M.cur,twd,cat:M.cat,name:M.name||cat.l,date:M.date,loc:M.loc,tags:[...M.tags],rcpt:M.scanned};
    }else{
      const now=new Date(),time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      S.expenses.unshift({id:Date.now(),amount:parseFloat(M.amt),cur:M.cur,twd,cat:M.cat,name:M.name||cat.l,date:M.date,time,loc:M.loc,tags:[...M.tags],rcpt:M.scanned,tripId:S.tripId});
    }
    save();closeM();
  };
}
function openM(cat,exp=null){
  if(exp){M={open:true,editId:exp.id,cat:exp.cat,amt:exp.amount.toString(),cur:exp.cur,name:exp.name,date:exp.date,loc:exp.loc||'',tags:[...(exp.tags||[])],cpOpen:false,scanning:false,scanned:exp.rcpt||false};}
  else{M={open:true,editId:null,cat,amt:'',cur:'JPY',name:'',date:td(),loc:'',tags:[],cpOpen:false,scanning:false,scanned:false};}
  render();
}
function closeM(){M.open=false;render();}
